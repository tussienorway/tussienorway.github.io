<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tussienorway – mine nettsider</title>
<meta name="description" content="Live oversikt over alle nettsidene til tussienorway på GitHub Pages.">
<style>
:root{
  --bg:#121117;--panel:#1c1a23;--panel2:#25222f;--ink:#ece9f3;--muted:#a39fb2;
  --accent:#7cc4ff;--accent2:#e2c275;--line:#34303f;--ok:#5fb37a;--warn:#e0a84f;--err:#e06a6a;
  --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:24px 18px 60px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{margin:0;font-size:clamp(1.6rem,4vw,2.3rem);letter-spacing:.2px}
h1 span{color:var(--accent2)}
.sub{color:var(--muted);margin:4px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.toolbar input,.toolbar select,button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.toolbar input{flex:1 1 220px;min-width:0}
button{cursor:pointer}button:hover{border-color:var(--accent)}button:disabled{opacity:.6;cursor:wait}
.primary{background:#1f3a52;border-color:#2f5878}
.status{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:.92rem;margin:4px 2px 16px}
.status b{color:var(--ink)}
.msg{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;border:1px solid}
.msg.warn{background:#2c2416;border-color:#5a4520;color:#f1d6a6}
.msg.err{background:#2c1719;border-color:#6a2a2f;color:#f3c1c1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.card:hover{border-color:#4a4560;transform:translateY(-2px)}
.card h2{margin:0;font-size:1.15rem;word-break:break-word}
.card h2 a{color:var(--ink)}
.desc{color:var(--muted);margin:0;flex:1}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem}
.tag{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.tag.lang{color:var(--accent2)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{display:inline-block;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:.92rem}
.btn.live{background:#1f3a52;border-color:#2f5878}
.btn:hover{text-decoration:none;border-color:var(--accent)}
.upd{font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px;border:1px dashed var(--line);border-radius:var(--radius)}
details{margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
summary{cursor:pointer;padding:10px 0;font-weight:600}
.repolist{list-style:none;padding:0;margin:0 0 12px}
.repolist li{padding:8px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.repolist .desc{flex:1 1 260px}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;text-align:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:520px){.wrap{padding:16px 12px 40px}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mine <span>nettsider</span></h1>
      <p class="sub">Live oversikt over alle GitHub Pages-sidene til <a href="https://github.com/tussienorway">@tussienorway</a>.</p>
    </div>
  </header>

  <div class="toolbar" role="search">
    <input id="q" type="search" placeholder="Søk i navn, beskrivelse, emner …" aria-label="Søk">
    <select id="sort" aria-label="Sorter">
      <option value="updated">Sist oppdatert</option>
      <option value="name">Navn (A–Å)</option>
    </select>
    <button id="refresh" class="primary" type="button">↻ Oppdater</button>
  </div>

  <div class="status" id="status" aria-live="polite"></div>
  <div id="msg"></div>
  <div class="grid" id="grid"></div>

  <details id="otherBox" hidden>
    <summary>Andre offentlige repoer (uten nettside) – <span id="otherCount">0</span></summary>
    <ul class="repolist" id="other"></ul>
  </details>

  <footer>Data hentes direkte fra GitHub sitt offentlige API hver gang siden åpnes. Siste resultat lagres i nettleseren, så noe vises selv om GitHub sier stopp (60 kall i timen).</footer>
</div>

<script>
/* ===== Innstillinger ===== */
const USER = 'tussienorway';
const API = `https://api.github.com/users/${USER}/repos?per_page=100&sort=updated`;
const CACHE_KEY = 'tn-pages-cache-v1';
const USER_SITE = `${USER}.github.io`.toLowerCase();

const $ = s => document.querySelector(s);
const state = { repos: [], fetchedAt: null, fromCache: false };

const fmt = new Intl.DateTimeFormat('nb-NO', { timeZone: 'Europe/Oslo', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
function fmtDate(iso){ try { return fmt.format(new Date(iso)); } catch { return iso || ''; } }
function relTime(iso){
  const diff = (Date.now() - new Date(iso).getTime())/1000;
  const rtf = new Intl.RelativeTimeFormat('nb-NO', { numeric: 'auto' });
  const steps = [[60,'second'],[3600,'minute'],[86400,'hour'],[604800,'day'],[2629800,'week'],[31557600,'month'],[Infinity,'year']];
  const div = {second:1,minute:60,hour:3600,day:86400,week:604800,month:2629800,year:31557600};
  for (const [lim,unit] of steps) if (Math.abs(diff) < lim) return rtf.format(-Math.round(diff/div[unit]), unit);
  return '';
}
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function liveUrl(repo){
  if (repo.name.toLowerCase() === USER_SITE) return `https://${USER_SITE}/`;
  return `https://${USER}.github.io/${repo.name}/`;
}
function nextLink(h){
  if (!h) return null;
  for (const part of h.split(',')) { const m = part.match(/<([^>]+)>;\s*rel="next"/); if (m) return m[1]; }
  return null;
}

async function fetchAll(){
  let url = API, all = [], guard = 0;
  while (url && guard++ < 20) {
    const r = await fetch(url, { headers: { 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) {
      const err = new Error('HTTP ' + r.status);
      err.status = r.status;
      err.remaining = r.headers.get('x-ratelimit-remaining');
      err.reset = r.headers.get('x-ratelimit-reset');
      throw err;
    }
    all = all.concat(await r.json());
    url = nextLink(r.headers.get('link'));
  }
  return all;
}

function slim(r){
  return { name:r.name, description:r.description, html_url:r.html_url, has_pages:!!r.has_pages, fork:!!r.fork, archived:!!r.archived,
    language:r.language, topics:r.topics||[], updated_at:r.pushed_at && r.pushed_at > r.updated_at ? r.pushed_at : r.updated_at,
    homepage:r.homepage, stars:r.stargazers_count };
}

function saveCache(){ try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: state.fetchedAt, repos: state.repos })); } catch {} }
function loadCache(){ try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); if (c && Array.isArray(c.repos)) return c; } catch {} return null; }

function showMsg(kind, html){ $('#msg').innerHTML = html ? `<div class="msg ${kind}">${html}</div>` : ''; }

function render(){
  const q = $('#q').value.trim().toLowerCase();
  const sort = $('#sort').value;
  const match = r => !q || [r.name, r.description, r.language, ...(r.topics||[])].join(' ').toLowerCase().includes(q);
  const sorter = sort === 'name'
    ? (a,b) => a.name.localeCompare(b.name, 'nb')
    : (a,b) => new Date(b.updated_at) - new Date(a.updated_at);

  const pages = state.repos.filter(r => r.has_pages);
  const shown = pages.filter(match).sort(sorter);
  const others = state.repos.filter(r => !r.has_pages && match(r)).sort(sorter);

  $('#grid').innerHTML = shown.length ? shown.map(r => `
    <article class="card">
      <h2><a href="${esc(liveUrl(r))}">${esc(r.name)}</a></h2>
      <p class="desc">${r.description ? esc(r.description) : '<i>Ingen beskrivelse</i>'}</p>
      <div class="meta">
        ${r.language ? `<span class="tag lang">${esc(r.language)}</span>` : ''}
        ${(r.topics||[]).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}
        ${r.archived ? '<span class="tag">arkivert</span>' : ''}
      </div>
      <div class="upd" title="${esc(fmtDate(r.updated_at))}">Oppdatert ${esc(fmtDate(r.updated_at))} (${esc(relTime(r.updated_at))})</div>
      <div class="links">
        <a class="btn live" href="${esc(liveUrl(r))}">Åpne nettsiden ↗</a>
        <a class="btn" href="${esc(r.html_url)}">Repo</a>
      </div>
    </article>`).join('')
    : `<div class="empty">${pages.length ? 'Ingen nettsider passer søket.' : (state.fetchedAt ? 'Fant ingen nettsider med GitHub Pages ennå.' : '')}</div>`;

  const box = $('#otherBox');
  box.hidden = !state.repos.some(r => !r.has_pages);
  $('#otherCount').textContent = others.length;
  $('#other').innerHTML = others.map(r => `
    <li><a href="${esc(r.html_url)}"><b>${esc(r.name)}</b></a>
      <span class="desc">${esc(r.description || '')}</span>
      ${r.language ? `<span class="tag lang">${esc(r.language)}</span>` : ''}
      <span class="upd">${esc(relTime(r.updated_at))}</span></li>`).join('');

  const st = [];
  st.push(`<span><b>${pages.length}</b> ${pages.length === 1 ? 'nettside' : 'nettsider'}${q ? ` (${shown.length} vist)` : ''}</span>`);
  st.push(`<span><b>${state.repos.length}</b> offentlige repoer totalt</span>`);
  if (state.fetchedAt) st.push(`<span>${state.fromCache ? 'Lagret kopi fra' : 'Hentet'} ${esc(fmtDate(state.fetchedAt))}</span>`);
  $('#status').innerHTML = st.join('');
}

async function load(){
  const btn = $('#refresh');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Henter …';
  try {
    const raw = await fetchAll();
    state.repos = raw.map(slim);
    state.fetchedAt = new Date().toISOString();
    state.fromCache = false;
    saveCache();
    showMsg('', '');
  } catch (e) {
    const c = loadCache();
    let why;
    if ((e.status === 403 || e.status === 429) && e.remaining === '0') {
      const when = e.reset ? fmtDate(new Date(e.reset * 1000).toISOString()) : 'om en stund';
      why = `GitHub har nådd grensen på 60 oppslag i timen fra denne nettverkstilkoblingen. Prøv igjen etter ${esc(when)}.`;
    } else if (e.status === 404) {
      why = `Fant ikke brukeren «${esc(USER)}» på GitHub.`;
    } else if (e.status) {
      why = `GitHub svarte med en feil (${esc(e.status)}). Prøv «Oppdater» om litt.`;
    } else {
      why = 'Fikk ikke kontakt med GitHub. Sjekk internettforbindelsen og prøv «Oppdater».';
    }
    if (c) {
      state.repos = c.repos; state.fetchedAt = c.t; state.fromCache = true;
      showMsg('warn', `⚠️ ${why}<br>Viser siste lagrede oversikt fra ${esc(fmtDate(c.t))}.`);
    } else {
      showMsg('err', `😕 Klarte ikke å hente oversikten. ${why}`);
    }
  } finally {
    btn.disabled = false; btn.textContent = '↻ Oppdater';
    render();
  }
}

/* Vis lagret kopi med en gang, så hentes ferske data */
(function init(){
  const c = loadCache();
  if (c) { state.repos = c.repos; state.fetchedAt = c.t; state.fromCache = true; render(); }
  $('#q').addEventListener('input', render);
  $('#sort').addEventListener('change', render);
  $('#refresh').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
