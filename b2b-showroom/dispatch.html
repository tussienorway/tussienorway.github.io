      render();
    }

    function copyToClipboard(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        const oldText = btn.innerHTML;
        btn.innerHTML = '✓ Kopiert!';
        btn.classList.add('bg-emerald-600', 'text-white');
        setTimeout(() => {
          btn.innerHTML = oldText;
          btn.classList.remove('bg-emerald-600', 'text-white');
        }, 2000);
      });
    }

    function render() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      const filter = document.getElementById('filterMode').value;
      const sent = getSent();
      
      document.getElementById('statSent').textContent = Object.keys(sent).length;

      const filtered = LEADS.filter(l => {
        if (filter === 'has_email' && !l.email) return false;
        if (filter === 'has_phone' && !l.phone) return false;
        if (filter === 'has_either' && !l.email && !l.phone) return false;
        
        if (!query) return true;
        return l.name.toLowerCase().includes(query) ||
               l.ceo.toLowerCase().includes(query) ||
               l.municipality.toLowerCase().includes(query) ||
               l.nace.toLowerCase().includes(query) ||
               l.orgnr.includes(query);
      });

      const container = document.getElementById('leadsList');
      if (filtered.length === 0) {
        container.innerHTML = '<div class="p-8 text-center bg-slate-900 border border-slate-800 rounded-xl text-slate-400">Ingen bedrifter matcher søkekriteriene.</div>';
        return;
      }

      container.innerHTML = filtered.map(l => {
        const isSent = Boolean(sent[l.orgnr]);
        const mailto = l.email ? `mailto:${encodeURIComponent(l.email)}?subject=${encodeURIComponent(l.subject)}&body=${encodeURIComponent(l.body)}` : '#';
        const smsLink = l.phone ? `sms:${encodeURIComponent(l.phone)}?&body=${encodeURIComponent(l.sms)}` : '#';

        return `
          <div class="bg-slate-900 border ${isSent ? 'border-emerald-600/60 bg-emerald-950/10' : 'border-slate-800'} rounded-2xl p-5 transition flex flex-col lg:flex-row lg:items-center justify-between gap-5">
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-2 flex-wrap">
                <span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">${l.municipality}</span>
                <span class="text-xs text-slate-400 font-mono">Org.nr: ${l.orgnr}</span>
                <span class="text-xs text-cyan-400 bg-cyan-950/40 border border-cyan-800/40 px-2 py-0.5 rounded">${l.nace}</span>
                ${isSent ? '<span class="text-xs font-bold bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full border border-emerald-500/40">✓ SENDT</span>' : ''}
              </div>
              <h2 class="text-xl font-bold text-white tracking-tight">${l.name}</h2>
              <div class="text-xs text-slate-300 mt-1 flex gap-4 flex-wrap">
                <span>👤 <strong>${l.ceo}</strong></span>
                <span>📧 ${l.email ? `<a href="${mailto}" class="text-cyan-400 underline font-semibold">${l.email}</a>` : '<span class="text-slate-500">Mangler direkte e-post</span>'}</span>
                <span>📱 ${l.phone ? `<a href="${smsLink}" class="text-emerald-400 underline font-semibold">${l.phone}</a>` : '<span class="text-slate-500">Mangler direkte tlf</span>'}</span>
              </div>
            </div>

            <div class="flex flex-wrap sm:flex-nowrap items-center gap-2.5 shrink-0">
              <a href="${l.preview}" target="_blank" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-cyan-300 px-3.5 py-2.5 rounded-xl border border-slate-700 transition">
                👁️ Åpne Demo
              </a>
              ${l.email ? `
                <a href="${mailto}" onclick="markSent('${l.orgnr}')" class="text-xs font-bold bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2.5 rounded-xl transition shadow-lg shadow-cyan-900/30">
                  📧 Send E-post
                </a>
              ` : `
                <button disabled class="text-xs font-bold bg-slate-800/50 text-slate-600 px-4 py-2.5 rounded-xl cursor-not-allowed">
                  Mangler E-post
                </button>
              `}
              ${l.phone ? `
                <a href="${smsLink}" onclick="markSent('${l.orgnr}')" class="text-xs font-bold bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl transition shadow-lg shadow-emerald-900/30">
                  💬 Send SMS
                </a>
              ` : ''}
              <button onclick="copyToClipboard(\`${l.body.replace(/`/g, '\\`')}\`, this)" class="text-xs font-bold bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2.5 rounded-xl border border-slate-700 transition">
                Kopier E-post
              </button>
              ${isSent ? `
                <button onclick="unmarkSent('${l.orgnr}')" class="text-xs text-slate-400 hover:text-rose-400 px-2 py-1">
                  ✕ Nullstill
                </button>
              ` : `
                <button onclick="markSent('${l.orgnr}')" class="text-xs text-slate-500 hover:text-emerald-400 px-2 py-1">
                  ✓ Merk sendt
                </button>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('filterMode').addEventListener('change', render);
    render();
  </script>
</body>
</html>
